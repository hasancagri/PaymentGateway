<rect data-type="sticky" x="494" y="300" width="199" height="228" data-color="red" data-content="PG store-kontratı transport" />
<rect data-type="sticky" x="717" y="300" width="199" height="228" data-color="red" data-content="ledger sınırı" />
</g>
