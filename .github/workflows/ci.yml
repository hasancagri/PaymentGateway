name: CI

# TETİK: master'a push VEYA herhangi bir PR açıl/güncellenince koş.
# feature push'u yalnız pull_request'i tetikler (push master'a kısıtlı) — çift koşu yok.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ───────────── GUARD: repo invariant'ları (spec yolları + FLOW.md anchor'ları) ─────────────
  # check-claude-spec-links: CLAUDE.md specs/NNN-* yolları var mı. check-flow-links: FLOW.md anchor
  # tip adları kodda hâlâ mevcut mu (İLKE VII/IX drift). bash ile çağrılır → executable bit gerekmez.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-claude-spec-links.sh
      - run: bash scripts/check-flow-links.sh

  # ───────────── KAPI: her PR + her master push'ta derle + test ─────────────
  # Platform.Auth bağımlılığı YOK (kendi Identity.Server'ı) → ek feed/auth gerekmez, düz nuget.org.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  # ───────────── ÜRETİM: yalnız master merge'inde image bas + ghcr'a it ─────────────
  # needs: build-test (kapı) · if: yalnız master push · aspire do push → yaşayan servis image → ghcr.
  image:
    needs: [build-test, guards]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # ghcr'a image yazma izni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aspire CLI kur
        run: |
          dotnet tool install -g Aspire.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # ghcr login: GITHUB_TOKEN kişisel (user) namespace'inde yeni paket OLUŞTURAMAZ
      # (denied: permission_denied: write_package) → write:packages'li PAT (GHCR_PAT secret) şart.
      - name: ghcr login
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Dockerfile'sız SDK container build + ghcr'a it → ghcr.io/hasancagri/paymentgateway/<servis>.
      - name: Image bas + ghcr'a it
        run: aspire do push --apphost src/aspire/AppHost/AppHost.csproj --non-interactive

      # CD kararlı tag: aspire-tag'li image'ları :latest'e retag + push (deploy rollout bunu çeker).
      - name: latest tag retag + push
        run: |
          for svc in payment-api gateway; do
            repo="ghcr.io/hasancagri/paymentgateway/$svc"
            src=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "^${repo}:aspire-deploy-" | head -1)
            if [ -n "$src" ]; then docker tag "$src" "$repo:latest" && docker push "$repo:latest"; fi
          done

  # ───────────── CD: master merge'inde cluster'a deploy (SSH → kubectl, namespace pg) ─────────────
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H 91.132.49.70 >> ~/.ssh/known_hosts 2>/dev/null
      # NOT: remote script tek-tirnakli; icine Turkce apostrof KOYMA (tirnagi kapatir).
      - name: Manifest kopyala + uygula + app rollout
        run: |
          # scp -r hedef dizin VARSA icine nest eder (/tmp/.../k8s/...) -> apply -f (non-recursive)
          # bayat ilk-kopyayi tekrar uygular. Her deploy'da remote tmp'yi SIFIRLA (nesting bug fix).
          ssh -i ~/.ssh/deploy root@91.132.49.70 'rm -rf /tmp/pg-k8s'
          scp -i ~/.ssh/deploy -r deploy/k8s root@91.132.49.70:/tmp/pg-k8s
          ssh -i ~/.ssh/deploy root@91.132.49.70 '
            set -e
            kubectl apply -f /tmp/pg-k8s/
            apps=$(kubectl -n pg get deploy -o name | grep -vE "postgres|rabbitmq")
            kubectl -n pg rollout restart $apps
            kubectl -n pg rollout status $apps --timeout=300s
          '