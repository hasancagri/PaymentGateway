name: CI

# TETİK: master'a push VEYA herhangi bir PR açıl/güncellenince koş.
# feature push'u yalnız pull_request'i tetikler (push master'a kısıtlı) — çift koşu yok.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ───────────── KAPI: her PR + her master push'ta derle + test ─────────────
  # Platform.Auth bağımlılığı YOK (kendi Identity.Server'ı) → ek feed/auth gerekmez, düz nuget.org.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build
      - run: dotnet test --no-build

  # ───────────── ÜRETİM: yalnız master merge'inde image bas + ghcr'a it ─────────────
  # needs: build-test (kapı) · if: yalnız master push · aspire do push → 6 servis image → ghcr.
  image:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write             # ghcr'a image yazma izni
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Aspire CLI kur
        run: |
          dotnet tool install -g Aspire.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Dockerfile'sız SDK container build + ghcr'a it → ghcr.io/hasancagri/paymentgateway/<servis> (6 image).
      - name: Image bas + ghcr'a it
        run: aspire do push --apphost src/aspire/AppHost/AppHost.csproj --non-interactive