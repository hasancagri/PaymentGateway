# PaymentGateway k8s — ns pg + Postgres(1 DB) + RabbitMQ + payment-api (tek yaşayan servis).
# ÖĞRENME/DEV: ephemeral PG. Kimlik birleşimi: PG kendi IdP'sini BIRAKTI (EC→PG = API key); identity-server
# SÖKÜLDÜ. PaymentLink/key = placeholder (gerçek canlı: ingress+TLS+gerçek sır ister).
# Bir-kerelik: ghcr-pull (kopyalandı) + DEPLOY_SSH_KEY (kuruldu) + GHCR_PAT repo secret (kullanıcı).
---
apiVersion: v1
kind: Namespace
metadata: { name: pg }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: pg }
data:
  init.sql: |
    CREATE DATABASE "paymentDb";
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: PgwPg2026 }
          ports: [ { containerPort: 5432 } ]
          volumeMounts: [ { name: init, mountPath: /docker-entrypoint-initdb.d } ]
      volumes: [ { name: init, configMap: { name: postgres-init } } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: pg }
spec: { selector: { app: postgres }, ports: [ { port: 5432, targetPort: 5432 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports: [ { containerPort: 5672 }, { containerPort: 15672 } ]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: pg }
spec:
  selector: { app: rabbitmq }
  ports: [ { name: amqp, port: 5672, targetPort: 5672 }, { name: mgmt, port: 15672, targetPort: 15672 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-api, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata: { labels: { app: payment-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: payment-api
          image: ghcr.io/hasancagri/paymentgateway/payment-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__paymentDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=paymentDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            # Kimlik birleşimi: PG IdP söküldü. EC→PG = API key (StoreApiKeyOptions.ExpectedKey required/
            # ValidateOnStart → placeholder; gerçek canlı: secret-store). IdentityOption__* kaldırıldı.
            - { name: "StoreApiKeyOptions__ExpectedKey", value: "dummy-store-api-key" }
            # 088/089/090: HostedPaymentOptions SÖKÜLDÜ → PaymentLinkOptions + StoreCallbackOptions (required,
            # ValidateOnStart). LinkBaseUrl/TrustPageTitle/TrustPageIntro + CallbackUrl/CallbackSecret zorunlu →
            # eksikse pod crashloop. Değerler placeholder (gerçek canlı: ingress/TLS + gerçek sır). PosAccount/
            # InterVposBank/BankRouting bu versiyonda EMPTY (boot olur, çekim routing'i yok — placeholder).
            - { name: "PaymentLinkOptions__LinkBaseUrl", value: "http://payment-api:8080/payment-links" }
            - { name: "PaymentLinkOptions__TrustPageTitle", value: "Odeme" }
            - { name: "PaymentLinkOptions__TrustPageIntro", value: "Guvenli odeme sayfasi" }
            - { name: "StoreCallbackOptions__CallbackUrl", value: "http://payment-api:8080/internal/callback" }
            - { name: "StoreCallbackOptions__CallbackSecret", value: "dummy-callback-secret" }
---
apiVersion: v1
kind: Service
metadata: { name: payment-api, namespace: pg }
spec: { selector: { app: payment-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
