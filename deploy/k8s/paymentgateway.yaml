# PaymentGateway k8s — ns pg + Postgres(1 DB) + RabbitMQ + payment-api (tek yaşayan servis).
# ÖĞRENME/DEV: ephemeral PG. Kimlik birleşimi: PG kendi IdP'sini BIRAKTI (EC→PG = API key); identity-server
# SÖKÜLDÜ. PaymentLink/key = placeholder (gerçek canlı: ingress+TLS+gerçek sır ister).
# Bir-kerelik: ghcr-pull (kopyalandı) + DEPLOY_SSH_KEY (kuruldu) + GHCR_PAT repo secret (kullanıcı).
---
apiVersion: v1
kind: Namespace
metadata: { name: pg }
---
# Sır `pg-secrets` MANIFEST'TE DEĞİL — operatör out-of-band uygular (güçlü değerler, commit edilmez, CD apply
# ETMEZ → gerçek sır ezilmez). İçerik: store-api-key (EC ile ORTAK), store-callback-secret + onboarding-callback-secret
# (EC ile ORTAK HMAC), credential-encryption-key (Base64 32 byte AES-256, KAYBOLURSA saklı credential çözülemez).
#   kubectl -n pg create secret generic pg-secrets \
#     --from-literal=store-api-key=... --from-literal=store-callback-secret=... \
#     --from-literal=onboarding-callback-secret=... --from-literal=credential-encryption-key=<base64-32>
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: pg }
data:
  init.sql: |
    CREATE DATABASE "paymentDb";
---
# Kalıcı disk (PVC): Postgres verisi pod restart/redeploy'da SİLİNMESİN diye. Ephemeral'ı değiştirir —
# ödeme defteri + şifreli credential'lar diskte kalır. ReadWriteOnce (tek node mount), default StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data, namespace: pg }
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: PgwPg2026 }
          ports: [ { containerPort: 5432 } ]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: data, mountPath: /var/lib/postgresql/data }   # kalıcı PVC (init.sql yalnız boş diskte ilk kez koşar)
      volumes:
        - { name: init, configMap: { name: postgres-init } }
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: pg }
spec: { selector: { app: postgres }, ports: [ { port: 5432, targetPort: 5432 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports: [ { containerPort: 5672 }, { containerPort: 15672 } ]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: pg }
spec:
  selector: { app: rabbitmq }
  ports: [ { name: amqp, port: 5672, targetPort: 5672 }, { name: mgmt, port: 15672, targetPort: 15672 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-api, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata: { labels: { app: payment-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: payment-api
          image: ghcr.io/hasancagri/paymentgateway/payment-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            # DEMO cluster: gerçek banka YOK (MAVI/SARI/TURUNCU kurgusal). Localdeki çalışan zinciri birebir
            # taşımak için Development → StoreOnboardingDevSeeder + BinCard/komisyon dev-seed'leri çalışır,
            # mağaza Live doğar (Program.cs:222 IsDevelopment() gate'i). Yeni prod-özel kod YOK. (Scalar da açılır.)
            - { name: ASPNETCORE_ENVIRONMENT, value: "Development" }
            # Mağazayı Live'a taşıyan seeder (EC PgPaymentLinkOptions__MerchantId ile BİREBİR aynı GUID).
            - { name: "StoreOnboardingDevSeed__Enabled", value: "true" }
            - { name: "StoreOnboardingDevSeed__MerchantId", value: "11111111-1111-1111-1111-111111111111" }
            - { name: "StoreOnboardingDevSeed__StoreName", value: "Kitapçı" }
            - { name: "StoreOnboardingDevSeed__BankCode", value: "MAVIBANK" }
            - { name: "ConnectionStrings__paymentDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=paymentDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            # EC→PG = API key + callback/credential sırları → k8s Secret (pg-secrets), secretKeyRef (plaintext yaml DEĞİL, İlke VI).
            - { name: "StoreApiKeyOptions__ExpectedKey", valueFrom: { secretKeyRef: { name: pg-secrets, key: store-api-key } } }
            # 088/089/090: HostedPaymentOptions SÖKÜLDÜ → PaymentLinkOptions + StoreCallbackOptions (required,
            # ValidateOnStart). LinkBaseUrl/TrustPageTitle/TrustPageIntro + CallbackUrl/CallbackSecret zorunlu →
            # eksikse pod crashloop. Değerler placeholder (gerçek canlı: ingress/TLS + gerçek sır). PosAccount/
            # InterVposBank/BankRouting bu versiyonda EMPTY (boot olur, çekim routing'i yok — placeholder).
            # Müşteri-görünür tabanlar = PUBLIC domain (telefon tarayıcısı + banka→PG callback buradan erişir;
            # ingress pay.hasancagridemiriz.com → payment-api). İç S2S store-webhook'ları (aşağıda) cluster DNS kalır.
            - { name: "PaymentLinkOptions__LinkBaseUrl", value: "https://pay.hasancagridemiriz.com/payment-links" }
            - { name: "PaymentLinkOptions__TrustPageTitle", value: "Odeme" }
            - { name: "PaymentLinkOptions__TrustPageIntro", value: "Guvenli odeme sayfasi" }
            # Ödeme sonucu webhook'u EC'ye (cross-ns): EC ProcessPaymentCallback (POST /payments/callback, X-Signature).
            # Eskiden payment-api:8080/internal/callback = PG'nin KENDİSİ (ns pg) → EC'ye hiç ulaşmıyordu.
            - { name: "StoreCallbackOptions__CallbackUrl", value: "http://payment-api.ecommerce:8080/payments/callback" }
            - { name: "StoreCallbackOptions__CallbackSecret", valueFrom: { secretKeyRef: { name: pg-secrets, key: store-callback-secret } } }
            # Charge: banka simülatörleri cluster'da (ns banksim). appsettings localhost:530x'i cross-ns DNS ile ez.
            # UserPass simülatör seed'i APIPASS (InterVpos NonSecure hash doğrulamaz; Turuncu SHA512 → SecretKey şart).
            - { name: "InterVposBankOptions__Banks__0__BaseUrl", value: "http://mavibank-api.banksim:8080" }
            - { name: "InterVposBankOptions__Banks__1__BaseUrl", value: "http://saribank-api.banksim:8080" }
            - { name: "InterVposBankOptions__Banks__2__BaseUrl", value: "http://turuncubank-api.banksim:8080" }
            - { name: "InterVposBankOptions__Banks__0__UserPass", value: "APIPASS" }
            - { name: "InterVposBankOptions__Banks__1__UserPass", value: "APIPASS" }
            - { name: "InterVposBankOptions__Banks__2__UserPass", value: "APIPASS" }
            - { name: "InterVposBankOptions__Banks__2__SecretKey", value: "TEST_SECRET_TURU0001" }
            # 091: StoreOnboarding (store aktivasyon). FormBaseUrl/CallbackBaseUrl/FormPageTitle/FormPageIntro +
            # BankCodes (MinLength 1) + OnboardingStoreCallback + CredentialEncryption.Key ZORUNLU (ValidateOnStart)
            # → eksikse crashloop. Placeholder (gerçek canlı: ingress domain + secret-store). Ttl default (24h).
            - { name: "StoreOnboardingOptions__FormBaseUrl", value: "https://pay.hasancagridemiriz.com/store-onboarding" }
            - { name: "StoreOnboardingOptions__CallbackBaseUrl", value: "https://pay.hasancagridemiriz.com" }
            - { name: "StoreOnboardingOptions__FormPageTitle", value: "Uye Isyeri Basvurusu" }
            - { name: "StoreOnboardingOptions__FormPageIntro", value: "Isyeri bilgilerini gir" }
            - { name: "StoreOnboardingOptions__BankCodes__0", value: "MAVIBANK" }
            - { name: "StoreOnboardingOptions__BankCodes__1", value: "SARIBANK" }
            - { name: "StoreOnboardingOptions__BankCodes__2", value: "TURUNCUBANK" }
            - { name: "OnboardingStoreCallbackOptions__CallbackUrl", value: "http://payment-api:8080/internal/onboarding-callback" }
            - { name: "OnboardingStoreCallbackOptions__CallbackSecret", valueFrom: { secretKeyRef: { name: pg-secrets, key: onboarding-callback-secret } } }
            # 093: at-rest credential AES DEK — Secret'tan (Base64 32 byte). Kaybolursa saklı credential'lar çözülemez.
            - { name: "CredentialEncryptionOptions__Key", valueFrom: { secretKeyRef: { name: pg-secrets, key: credential-encryption-key } } }
---
apiVersion: v1
kind: Service
metadata: { name: payment-api, namespace: pg }
spec: { selector: { app: payment-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
# Public giriş: pay.hasancagridemiriz.com → payment-api (hosted ödeme sayfası + müşteri/banka callback'leri).
# VARSAYIM: Traefik ingress controller + cert-manager ClusterIssuer "letsencrypt-prod" kurulu. Cloudflare DNS
# pay.hasancagridemiriz.com → cluster giriş IP'sine A/CNAME. (Cloudflare Tunnel kullanılacaksa bu Ingress yerine
# cloudflared + tunnel ingress-rule — o zaman ingressClassName/TLS gerekmez.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api
  namespace: pg
  annotations: { cert-manager.io/cluster-issuer: "letsencrypt-prod" }
spec:
  ingressClassName: traefik
  tls:
    - hosts: [ "pay.hasancagridemiriz.com" ]
      secretName: pay-tls
  rules:
    - host: "pay.hasancagridemiriz.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: payment-api, port: { number: 8080 } } }
