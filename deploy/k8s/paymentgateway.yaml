# PaymentGateway k8s — ns pg + Postgres(4 DB) + RabbitMQ + Mailpit + 6 servis.
# ÖĞRENME/DEV: ephemeral PG, Identity.Server issuer https://localhost:5101 HARDCODED (http:8080 dinler,
# boot geçer), Iyzico/HostedPayment/Auth = placeholder (gerçek ödeme/auth ingress+TLS+gerçek sır ister).
# Bir-kerelik: ghcr-pull (kopyalandı) + DEPLOY_SSH_KEY (kuruldu) + GHCR_PAT repo secret (kullanıcı).
---
apiVersion: v1
kind: Namespace
metadata: { name: pg }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: pg }
data:
  init.sql: |
    CREATE DATABASE "paymentDb";
    CREATE DATABASE "merchantDb";
    CREATE DATABASE "commissionDb";
    CREATE DATABASE "identityDb";
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD, value: PgwPg2026 }
          ports: [ { containerPort: 5432 } ]
          volumeMounts: [ { name: init, mountPath: /docker-entrypoint-initdb.d } ]
      volumes: [ { name: init, configMap: { name: postgres-init } } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: pg }
spec: { selector: { app: postgres }, ports: [ { port: 5432, targetPort: 5432 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports: [ { containerPort: 5672 }, { containerPort: 15672 } ]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: pg }
spec:
  selector: { app: rabbitmq }
  ports: [ { name: amqp, port: 5672, targetPort: 5672 }, { name: mgmt, port: 15672, targetPort: 15672 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit } }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:latest
          ports: [ { containerPort: 1025 }, { containerPort: 8025 } ]
---
apiVersion: v1
kind: Service
metadata: { name: mailpit, namespace: pg }
spec:
  selector: { app: mailpit }
  ports: [ { name: smtp, port: 1025, targetPort: 1025 }, { name: ui, port: 8025, targetPort: 8025 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: identity-server, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: identity-server } }
  template:
    metadata: { labels: { app: identity-server } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: identity-server
          image: ghcr.io/hasancagri/paymentgateway/identity-server:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__identityDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=identityDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
---
apiVersion: v1
kind: Service
metadata: { name: identity-server, namespace: pg }
spec: { selector: { app: identity-server }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-api, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: payment-api } }
  template:
    metadata: { labels: { app: payment-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: payment-api
          image: ghcr.io/hasancagri/paymentgateway/payment-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__paymentDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=paymentDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "IdentityOption__Address", value: "http://identity-server:8080" }
            - { name: "IdentityOption__Issuer", value: "https://localhost:5101" }
            - { name: "IdentityOption__Audience", value: "payment.api" }
            - { name: "IyzicoProviderSettings__ApiKey", value: "sandbox-dummy" }
            - { name: "IyzicoProviderSettings__SecretKey", value: "sandbox-dummy" }
            - { name: "IyzicoProviderSettings__BaseUrl", value: "https://sandbox-api.iyzipay.com" }
            - { name: "HostedPaymentOptions__CallbackSecret", value: "dummy-callback-secret" }
            - { name: "HostedPaymentOptions__IyzicoCallbackBaseUrl", value: "http://payment-api:8080/internal/payments/callback" }
            - { name: "HostedPaymentOptions__ReturnPageBaseUrl", value: "http://payment-api:8080/payments/return" }
            - { name: "HostedPaymentOptions__ReturnSuccessText", value: "Odeme basarili" }
            - { name: "HostedPaymentOptions__ReturnFailureText", value: "Odeme basarisiz" }
---
apiVersion: v1
kind: Service
metadata: { name: payment-api, namespace: pg }
spec: { selector: { app: payment-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: merchant-api, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: merchant-api } }
  template:
    metadata: { labels: { app: merchant-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: merchant-api
          image: ghcr.io/hasancagri/paymentgateway/merchant-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__merchantDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=merchantDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "IdentityOption__Address", value: "http://identity-server:8080" }
            - { name: "IdentityOption__Issuer", value: "https://localhost:5101" }
            - { name: "IdentityOption__Audience", value: "merchant.api" }
            - { name: "PlatformIdentityOption__Address", value: "http://identity-server.agentplatform:8080" }
            - { name: "PlatformIdentityOption__Audience", value: "merchant.api" }
            - { name: "Onboarding__PublicBaseUrl", value: "http://merchant-api:8080" }
            - { name: "AdminNotification__AdminEmail", value: "admin@paymentgateway.local" }
---
apiVersion: v1
kind: Service
metadata: { name: merchant-api, namespace: pg }
spec: { selector: { app: merchant-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: commission-api, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: commission-api } }
  template:
    metadata: { labels: { app: commission-api } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: commission-api
          image: ghcr.io/hasancagri/paymentgateway/commission-api:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__commissionDb", value: "Host=postgres;Port=5432;Username=postgres;Password=PgwPg2026;Database=commissionDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "IdentityOption__Address", value: "http://identity-server:8080" }
            - { name: "IdentityOption__Issuer", value: "https://localhost:5101" }
            - { name: "IdentityOption__Audience", value: "commission.api" }
            - { name: "PlatformIdentityOption__Address", value: "http://identity-server.agentplatform:8080" }
            - { name: "PlatformIdentityOption__Audience", value: "commission.api" }
---
apiVersion: v1
kind: Service
metadata: { name: commission-api, namespace: pg }
spec: { selector: { app: commission-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mail-worker, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: mail-worker } }
  template:
    metadata: { labels: { app: mail-worker } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: mail-worker
          image: ghcr.io/hasancagri/paymentgateway/mail-worker:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
            - { name: "Mail__Smtp__Host", value: "mailpit" }
            - { name: "Mail__Smtp__Port", value: "1025" }
            - { name: "Mail__Smtp__From", value: "onboarding@paymentgateway.local" }
---
apiVersion: v1
kind: Service
metadata: { name: mail-worker, namespace: pg }
spec: { selector: { app: mail-worker }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-web, namespace: pg }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin-web } }
  template:
    metadata: { labels: { app: admin-web } }
    spec:
      imagePullSecrets: [ { name: ghcr-pull } ]
      containers:
        - name: admin-web
          image: ghcr.io/hasancagri/paymentgateway/admin-web:latest
          imagePullPolicy: Always
          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "IdentityOption__Address", value: "http://identity-server:8080" }
            - { name: "AdminAuth__ClientId", value: "admin-ui" }
            - { name: "AdminAuth__ClientSecret", value: "admin-ui-secret" }
            - { name: "services__merchant-api__http__0", value: "http://merchant-api:8080" }
            - { name: "services__commission-api__http__0", value: "http://commission-api:8080" }
            - { name: "services__payment-api__http__0", value: "http://payment-api:8080" }
---
apiVersion: v1
kind: Service
metadata: { name: admin-web, namespace: pg }
spec: { selector: { app: admin-web }, ports: [ { port: 8080, targetPort: 8080 } ] }
