syntax = "proto3";

option csharp_namespace = "PaymentGateway.SyncContracts.Merchant";

package syncmerchant;

service SyncMerchantService {
    rpc GetMerchants (PageRequest) returns (MerchantsPage);
    rpc GetMerchantByApiKey (ApiKeyRequest) returns (MerchantApiKeyResponse);
}

message PageRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message MerchantItem {
    string merchant_id = 1;
    string webhook_url = 2;
    bool is_active = 3;
}

message MerchantsPage {
    repeated MerchantItem items = 1;
    bool has_next_page = 2;
}

message ApiKeyRequest {
    string key_hash = 1;
}

message MerchantApiKeyResponse {
    bool found = 1;
    string merchant_id = 2;
    string merchant_name = 3;
    int32 merchant_status = 4;
    int32 key_status = 5;
}