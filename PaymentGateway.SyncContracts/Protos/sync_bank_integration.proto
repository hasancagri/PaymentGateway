syntax = "proto3";

option csharp_namespace = "PaymentGateway.SyncContracts.BankIntegration";

package syncbankintegration;

service SyncBankIntegrationService {
    rpc GetMerchantBanks (PageRequest) returns (MerchantBanksPage);
}

message PageRequest {
    int32 page = 1;
    int32 page_size = 2;
}

message MerchantBankItem {
    string merchant_bank_id = 1;
    string merchant_id = 2;
    string bank_id = 3;
    string bank_name = 4;
    string ica_member_id = 5;
    repeated string supported_currencies = 6;
    bool is_active = 7;
}

message MerchantBanksPage {
    repeated MerchantBankItem items = 1;
    bool has_next_page = 2;
}